# Sveltia CMS config — edits data/race-config.json directly, through this
# form. See README.md "For content editors" for the plain-English version
# of what's safe to change here.
#
# Auth (backend.base_url below) is filled in once the Cloudflare Worker
# OAuth proxy is deployed — see the CMS rollout plan for the exact steps.
# Until then this file also works entirely locally via `local_backend`.

backend:
  name: github
  repo: kirschnerdeVilliers/Meyerton-MadMac-Marathon
  branch: main
  base_url: https://sveltia-cms-auth.kirschner-devilliers.workers.dev

local_backend: true

site_url: https://kirschnerdevilliers.github.io/Meyerton-MadMac-Marathon/
display_url: https://kirschnerdevilliers.github.io/Meyerton-MadMac-Marathon/
logo_url: /assets/img/madmac-badge.jpg

media_folder: "assets/img"
public_folder: "/assets/img"

collections:
  - name: "race"
    label: "Race content"
    files:
      - name: "config"
        label: "Race config (data/race-config.json)"
        file: "data/race-config.json"
        fields:

          - label: "Race basics"
            name: "edition"
            widget: object
            fields:
              - { label: "Year", name: "year", widget: number, value_type: int }
              - { label: "Race name", name: "raceName", widget: string }
              - { label: "Date (YYYY-MM-DD)", name: "date", widget: string, hint: "Format: 2026-10-04" }
              - { label: "Date, as displayed", name: "dateDisplay", widget: string }
              - { label: "Organiser", name: "organiser", widget: string }
              - { label: "Venue name", name: "venueName", widget: string }
              - { label: "Venue address", name: "venueAddress", widget: string }
              - label: "Coordinates"
                name: "coordinates"
                widget: object
                fields:
                  - { label: "Latitude", name: "lat", widget: number, value_type: float }
                  - { label: "Longitude", name: "lng", widget: number, value_type: float }
              - { label: "Positioning line", name: "positioning", widget: string }
              - { label: "Total field size", name: "totalFieldSize", widget: number, value_type: int }
              - { label: "Total prize money (R)", name: "totalPrizeMoney", widget: number, value_type: int }
              - { label: "Race Pass difficulty rating", name: "raceDifficulty", widget: string }
              - { label: "Race Pass star rating", name: "racePassRating", widget: number, value_type: float }

          - label: "Entries"
            name: "entries"
            widget: object
            fields:
              - { label: "Entry URL (Race Pass)", name: "entryUrl", widget: string }
              - { label: "Online close date/time (ISO)", name: "onlineCloseDate", widget: string, hint: "Format: 2026-09-22T21:00:00+02:00 — must include the +02:00 offset" }
              - { label: "Online close, as displayed", name: "onlineCloseDisplay", widget: string }
              - { label: "Late-fee start date/time (ISO)", name: "lateFeeStartDate", widget: string, hint: "Format: 2026-08-31T23:59:59+02:00 — must include the +02:00 offset" }
              - { label: "Late-fee start, as displayed", name: "lateFeeStartDisplay", widget: string }
              - { label: "Manual entry note", name: "manualEntryNote", widget: text }
              - { label: "Countdown note", name: "countdownNote", widget: text, hint: "The small print under the countdown clock on the hero. Mention the current fee situation here." }
              - { label: "Heading shown after entries close", name: "closedHeading", widget: string, hint: "The site switches to this by itself once the online close date passes — you don't need to change anything on the day." }

          - label: "Facebook"
            name: "facebook"
            widget: object
            fields:
              - { label: "Page URL", name: "pageUrl", widget: string }
              - { label: "Page name", name: "pageName", widget: string }

          - label: "WhatsApp channel"
            name: "whatsappChannel"
            widget: object
            required: false
            fields:
              - { label: "Channel link", name: "url", widget: string, required: false, hint: "The invite link from WhatsApp (Channel > share). Leave blank to hide the button everywhere." }
              - { label: "Button wording", name: "label", widget: string, required: false, hint: "Shown on the button in the Follow along section." }

          # These two are edited together. After each race, point the URL at that
          # year's results page on finishtime.co.za and bump the year to match —
          # a stale year here advertises the wrong results in the site footer.
          - { label: "Results page URL (deep link to a specific year's results)", name: "resultsUrl", widget: string }
          - { label: "Which year those results are for", name: "resultsYear", widget: number, value_type: int, required: false }

          - label: "Qualifying — Comrades & Two Oceans"
            name: "qualifiers"
            widget: object
            fields:
              - { label: "Qualifying standard", name: "standard", widget: string }
              - { label: "Cut-off vs qualifying-standard caveat", name: "cutoffCaveat", widget: text }
              - label: "Comrades"
                name: "comrades"
                widget: object
                fields:
                  - { label: "Name", name: "name", widget: string }
                  - { label: "Edition description", name: "edition", widget: string }
                  - { label: "Date (YYYY-MM-DD)", name: "date", widget: string }
                  - { label: "Date, as displayed", name: "dateDisplay", widget: string }
                  - { label: "Entry cap", name: "entryCap", widget: number, value_type: int }
                  - { label: "Previous entry cap", name: "previousCap", widget: number, value_type: int }
                  - { label: "Qualifying window start (YYYY-MM-DD)", name: "qualifyingWindowStart", widget: string }
                  - { label: "Qualifying window end (YYYY-MM-DD)", name: "qualifyingWindowEnd", widget: string }
                  - { label: "Qualifying window, as displayed", name: "qualifyingWindowDisplay", widget: string }
                  - { label: "Ballot close date (YYYY-MM-DD)", name: "ballotCloseDate", widget: string }
                  - { label: "Ballot close, as displayed", name: "ballotCloseDisplay", widget: string }
                  - { label: "Ballot note", name: "ballotNote", widget: text }
              - label: "Two Oceans"
                name: "twoOceans"
                widget: object
                fields:
                  - { label: "Name", name: "name", widget: string }
                  - { label: "Race type", name: "raceType", widget: string }
                  - { label: "Date (YYYY-MM-DD)", name: "date", widget: string }
                  - { label: "Date, as displayed", name: "dateDisplay", widget: string }
                  - { label: "Entry cap", name: "entryCap", widget: number, value_type: int }
                  - { label: "Previous entry cap", name: "previousCap", widget: number, value_type: int }
                  - { label: "Qualifying window start (YYYY-MM-DD)", name: "qualifyingWindowStart", widget: string }
                  - { label: "Qualifying window, as displayed", name: "qualifyingWindowDisplay", widget: string }
                  - { label: "Seeding note", name: "seedingNote", widget: text }
              - label: "Approved-list status (technical — do not edit casually)"
                name: "approvedListStatus"
                widget: string
                hint: "Used only in internal notes, not shown on the page. Leave as-is unless you know why you're changing it."
              - { label: "\"Single lap\" explainer note", name: "singleLapNote", widget: text }

          - label: "Course"
            name: "course"
            widget: object
            fields:
              - { label: "Measurement note", name: "measurementNote", widget: text }
              - { label: "Measurement certificate number", name: "measurementCertificateNumber", widget: string, required: false }
              - { label: "Approximate altitude (m)", name: "altitudeApprox", widget: number, value_type: int }
              - { label: "R59 crossing note", name: "r59CrossingNote", widget: text }
              - { label: "Surface confirmed?", name: "surfaceConfirmed", widget: boolean }

          - label: "Distances"
            name: "distances"
            widget: list
            min: 4
            max: 4
            allow_add: false
            summary: "{{fields.label}} — {{fields.shortLabel}}"
            fields:
              - label: "ID (technical — never change this)"
                name: "id"
                widget: string
                hint: "Must exactly match the distance's route data files. Changing this breaks the route map and elevation chart for this distance."
              - { label: "Label (e.g. 42.2km)", name: "label", widget: string }
              - { label: "Short label (e.g. Marathon)", name: "shortLabel", widget: string }
              - { label: "Is this the flagship distance?", name: "flagship", widget: boolean }
              - label: "GPX distance (km) — technical, from the route file"
                name: "gpxDistanceKm"
                widget: number
                value_type: float
              - { label: "Elevation min (m) — technical", name: "elevationMinM", widget: number, value_type: int }
              - { label: "Elevation max (m) — technical", name: "elevationMaxM", widget: number, value_type: int }
              - { label: "Total ascent, as displayed (e.g. 240–320)", name: "totalAscentM", widget: string }
              - { label: "Start time", name: "startTime", widget: string, hint: "24-hour format, e.g. 06:00" }
              - { label: "Minimum age", name: "minAge", widget: number, value_type: int }
              - { label: "Cut-off, in hours — technical", name: "cutoffHours", widget: number, value_type: float }
              - { label: "Cut-off, as displayed (e.g. 6h30)", name: "cutoffDisplay", widget: string }
              - label: "Entry fees (R)"
                name: "fees"
                widget: object
                fields:
                  - { label: "Early bird", name: "earlyBird", widget: number, value_type: int }
                  - { label: "Grandmaster", name: "grandmaster", widget: number, value_type: int }
                  - { label: "Late (after the deadline)", name: "late", widget: number, value_type: int }
              - { label: "Free shirts to first N entrants (leave blank if none)", name: "freeShirtsFirst", widget: number, value_type: int, required: false }
              - { label: "Elevation profile summary (shown on page)", name: "profileSummary", widget: text }
              - label: "GPX filename — technical, do not change"
                name: "gpxFile"
                widget: string
                hint: "Must match a real file in data/gpx/. Changing this without also replacing that file breaks the GPX download link."
              - { label: "Strava route URL", name: "stravaRouteUrl", widget: string }
              - { label: "Route description (shown on page)", name: "routeDescription", widget: text }

          - label: "Prize money"
            name: "prizeMoney"
            widget: object
            fields:
              - { label: "Total prize money (R)", name: "totalR", widget: number, value_type: int }
              - { label: "Equal-gender statement", name: "equalGenderStatement", widget: text }
              - { label: "Payment note", name: "paymentNote", widget: text }
              - label: "Prize categories"
                name: "categories"
                widget: list
                summary: "{{fields.category}} — {{fields.place}}"
                fields:
                  - label: "Category"
                    name: "category"
                    widget: string
                    hint: "If this is a masters/veteran category, keep the exact wording (e.g. \"Veteran 40+\") — it controls a visual highlight on the page."
                  - { label: "Place (e.g. 1st, or 1st / 2nd / 3rd for combined rows)", name: "place", widget: string }
                  - { label: "42.2km prize (R) — leave blank for none", name: "42_2km", widget: string, required: false, hint: "Usually a number, but can be text like \"500 / 350 / 250\" for a combined row" }
                  - { label: "22km prize (R) — leave blank for none", name: "22km", widget: string, required: false }
                  - { label: "11km prize (R) — leave blank for none", name: "11km", widget: string, required: false }

          - label: "Number collection points"
            name: "numberCollection"
            widget: list
            summary: "{{fields.dateDisplay}} — {{fields.venue}}"
            fields:
              - { label: "Date (YYYY-MM-DD)", name: "date", widget: string }
              - { label: "Date, as displayed", name: "dateDisplay", widget: string }
              - { label: "Time", name: "time", widget: string }
              - { label: "Venue", name: "venue", widget: string }
              - { label: "Is this race-day collection?", name: "raceDay", widget: boolean, required: false }

          - label: "What you get (perks)"
            name: "perks"
            widget: object
            fields:
              - { label: "T-shirt description", name: "tshirt", widget: text }
              - { label: "Medal description", name: "medal", widget: text }
              - { label: "Goodie bags (count)", name: "goodieBags", widget: number, value_type: int }
              - { label: "Extra shirt fee (R)", name: "extraShirtFeeR", widget: number, value_type: int }
              - label: "Platō Meyerton offer"
                name: "platoOffer"
                widget: object
                fields:
                  - { label: "Venue", name: "venue", widget: string }
                  - { label: "Discount", name: "discount", widget: string }
                  - { label: "Condition", name: "condition", widget: text }

          - label: "Race rules"
            name: "raceRules"
            widget: object
            fields:
              - { label: "Timing", name: "timing", widget: text }
              - { label: "Distance boards", name: "distanceBoards", widget: string }
              - { label: "Waterpoints", name: "waterpoints", widget: string }
              - { label: "Results published on", name: "resultsPublishedOn", widget: string }
              - { label: "Governing bodies", name: "governingBodies", widget: string }
              - { label: "Licence note", name: "licenceNote", widget: text }
              - { label: "Temporary licence fee (R) — leave blank if unknown", name: "temporaryLicenceFeeR", widget: number, value_type: int, required: false }
              - { label: "Prohibited items/behaviour", name: "prohibited", widget: text }
              - { label: "Age category note", name: "ageCategoryNote", widget: text }
              - { label: "Appeals process", name: "appeals", widget: text }

          - label: "Amenities"
            name: "amenities"
            widget: list
            field: { label: "Amenity", name: "item", widget: string }

          - label: "Testimonials"
            name: "testimonials"
            widget: object
            fields:
              - { label: "Source", name: "source", widget: string }
              - { label: "Source URL", name: "sourceUrl", widget: string }
              - { label: "Star rating", name: "rating", widget: number, value_type: float }
              - { label: "Review count", name: "reviewCount", widget: number, value_type: int }
              - label: "Quotes"
                name: "quotes"
                widget: list
                summary: "{{fields.name}} ({{fields.distance}}, {{fields.year}})"
                fields:
                  - { label: "Name", name: "name", widget: string }
                  - { label: "Distance run", name: "distance", widget: string }
                  - { label: "Year", name: "year", widget: number, value_type: int }
                  - { label: "Quote", name: "quote", widget: text }

          - label: "Photo gallery"
            name: "gallery"
            widget: object
            fields:
              - { label: "Internal note", name: "note", widget: text, required: false }
              - label: "Photos"
                name: "photos"
                widget: list
                summary: "{{fields.caption}}"
                fields:
                  - label: "Photo"
                    name: "file"
                    widget: image
                    media_folder: "/assets/img/gallery"
                    public_folder: "/assets/img/gallery"
                    choose_url: false
                  - label: "Alt text (describe the photo — matters for SEO and screen readers)"
                    name: "alt"
                    widget: string
                  - { label: "Caption (shown under the photo)", name: "caption", widget: string }

          - label: "FAQ"
            name: "faq"
            widget: list
            summary: "{{fields.q}}"
            fields:
              - { label: "Question", name: "q", widget: string }
              - { label: "Answer", name: "a", widget: text }

          - label: "Sponsors"
            name: "sponsors"
            widget: object
            fields:
              - { label: "Internal note", name: "note", widget: text, required: false }
              - label: "Sponsor list"
                name: "list"
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: "Name", name: "name", widget: string }
                  - label: "Logo (leave blank to show name as text only)"
                    name: "logo"
                    widget: image
                    required: false
                    media_folder: "/assets/img/sponsors"
                    public_folder: "/assets/img/sponsors"
                    choose_url: false
                  - { label: "Website URL (leave blank for no link)", name: "url", widget: string, required: false }

          - label: "Contact"
            name: "contact"
            widget: object
            fields:
              - { label: "Email", name: "email", widget: string, required: false }
              - { label: "Phone", name: "phone", widget: string, required: false }
              - { label: "WhatsApp number", name: "whatsapp", widget: string, required: false }
              - { label: "Instagram URL", name: "instagram", widget: string, required: false }

          # The site has two equally important actions: enter this year's
          # race, and join the mailing list for next year's. This group is
          # the whole of the second one's wording. It sits with the other
          # content groups, not in the collapsed technical ones below, on
          # purpose — it is marketing copy, not plumbing.
          - label: "Mailing list (2027 updates)"
            name: "mailingList"
            widget: object
            fields:
              - { label: "Eyebrow (small line above the heading)", name: "eyebrow", widget: string }
              - { label: "Heading", name: "heading", widget: string }
              - { label: "Body copy — while online entries are open", name: "body", widget: text }
              - { label: "Body copy — after online entries close", name: "bodyClosed", widget: text, hint: "The site switches to this automatically once entries close, and the sign-up moves to the front of the page. Nobody has to change anything on the day." }
              - { label: "Sign-up button label", name: "buttonLabel", widget: string }
              - { label: "Message shown after someone signs up", name: "successMessage", widget: string }
              - { label: "Mid-page prompt heading", name: "ctaHeading", widget: string, hint: "The short line above the pair of buttons after the FAQ. It sits above BOTH buttons, so it needs to make sense for someone entering this year as well as someone waiting for next year." }
              - { label: "Mid-page prompt heading — after entries close", name: "ctaHeadingClosed", widget: string }
              - { label: "Hero / mid-page button label", name: "ctaButtonLabel", widget: string, hint: "The second button in the hero, and the matching one further down." }
              - label: "POPIA consent paragraph"
                name: "consent"
                widget: text
                hint: >-
                  LEGAL WORDING. This is the promise the club makes about what it will email
                  people, and it is what their consent covers. Do not broaden it (to sponsor
                  mail, for example) without checking with the club first — and if you change
                  it at all, the Privacy Policy page has to be changed to match.

          - label: "Analytics (technical)"
            name: "analytics"
            widget: object
            collapsed: true
            fields:
              - { label: "Provider (none / ga4 / plausible)", name: "provider", widget: string }
              - { label: "GA4 measurement ID", name: "ga4Id", widget: string, required: false }
              - { label: "Plausible domain", name: "plausibleDomain", widget: string, required: false }
              - { label: "Meta Pixel ID", name: "metaPixelId", widget: string, required: false }

          - label: "Email capture (technical)"
            name: "emailCapture"
            widget: object
            collapsed: true
            fields:
              - { label: "Form endpoint URL", name: "endpointUrl", widget: string, required: false }
              - { label: "Provider name", name: "provider", widget: string }
              - { label: "Form field name", name: "fieldName", widget: string }
              # Declared so the CMS does not strip it on save — an undeclared
              # key is dropped from race-config.json entirely. Public key only;
              # the matching secret lives on the Worker, never here.
              - { label: "Turnstile site key (anti-spam — leave blank unless set up)", name: "turnstileSiteKey", widget: string, required: false }

          # Entry terms. Every field here is a policy decision, and terms.html
          # stays an unlisted, noindex draft until all six are filled in — so a
          # half-finished terms page cannot reach the public by accident.
          - label: "Entry terms and conditions"
            name: "terms"
            widget: object
            collapsed: true
            fields:
              - { label: "Internal note", name: "_comment", widget: text, required: false }
              - { label: "Last updated (e.g. 9 September 2026)", name: "lastUpdated", widget: string, required: false }
              - { label: "Refunds — are entry fees refundable, and when?", name: "refunds", widget: text, required: false }
              - { label: "Transfers — can an entry move to another runner or distance?", name: "transfers", widget: text, required: false }
              - { label: "Cancellation — what happens to entries if the race is called off?", name: "cancellation", widget: text, required: false }
              - { label: "Minimum ages per distance (confirm current ASA rules)", name: "minimumAges", widget: text, required: false }
              - { label: "Indemnity — use the club insurer's or ASA's wording, not your own", name: "indemnity", widget: text, required: false }
              - { label: "Photography — basis for publishing runner photos, and how to request removal", name: "imageConsent", widget: text, required: false }

          - label: "Unconfirmed facts (technical — leave blank until confirmed)"
            name: "placeholders"
            widget: object
            collapsed: true
            fields:
              - { label: "Internal note", name: "note", widget: text, required: false }
              - { label: "Road surface split", name: "roadSurfaceSplit", widget: string, required: false }
              - { label: "Temporary licence fee for 2026", name: "temporaryLicenceFee2026", widget: string, required: false }
              - { label: "Measurement certificate number", name: "measurementCertificateNumber", widget: string, required: false }
              - { label: "What the 11km's 10km timing point is for", name: "elevenKm10kTimingPurpose", widget: string, required: false }
              - { label: "Pacing buses", name: "pacingBuses", widget: string, required: false }

          - label: "Internal note (technical — do not edit)"
            name: "_comment"
            widget: string
