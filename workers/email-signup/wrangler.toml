name = "madmac-email-signup"
main = "worker.js"
compatibility_date = "2024-01-01"

# Optional per-IP rate limit. Commented out because it changes deploy
# behaviour and the Worker is correct without it — worker.js checks for the
# binding and skips the check when it is absent. Uncomment, confirm the
# current syntax against Cloudflare's rate-limiting docs (this API has
# changed shape before), then redeploy.
#
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1001"
# simple = { limit = 5, period = 60 }
